# Project-owned AI Engineering adoption manifest.
# This file is declarative documentation for Vivat Flow; no runtime parser is required.
framework:
  repository: leonardolnovaes/ai-engineering
  revision: acdd4aae0489495e3f2596ac13776867b56623b2
  revision_status: pending-ai-engineering-pr-2
  schema_version: 1

adoption:
  core_principles: experimental
  ai_efficiency_review:
    status: experimental
    policy: required

review:
  status: experimental
  self_review:
    policy: required-for-meaningful-changes
  independent_review:
    policy: required
    topology:
      codex: chatgpt
      chatgpt: codex
      other: user-selected-independent-ai-reviewer
    unavailable: pending
  final_merge: user

existing_rules:
  evaluation: pending
  default_cost_assessment: UNKNOWN
  policy:
    - evaluate each existing engineering and AI-assisted workflow rule individually
    - do not assume an existing rule is cheaper because it already exists
    - apply the AI Engineering quality non-regression guardrail while measuring cost
    - promote reusable findings only when evidence supports broader scope

boundaries:
  runtime_dependency_on_ai_engineering: false
  project_specific_rules_remain_in_vivat_flow: true
  private_project_evidence_remains_in_vivat_flow: true
  reviewer_and_vendor_choices_remain_in_vivat_flow: true
