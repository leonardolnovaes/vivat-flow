# Project-owned AI Engineering adoption manifest.
# This file is declarative documentation for Vivat Flow; no runtime parser is required.
schema_version: 3

framework:
  id: ai-engineering
  source:
    provider: github
    repository: leonardolnovaes/ai-engineering
    ref: 6f1823e63e0364c26f3ffdf905c54722db93355f
    consumer_protocol: CONSUMER_PROTOCOL.md
    rule_registry: RULES.json

context_routing:
  manifest: .ai-engineering/context-routing.yml

rules:
  default: enabled
  overrides: {}

review:
  status: experimental
  self_review:
    rule_id: self-review
    policy: required-for-meaningful-changes
  independent_review:
    rule_id: independent-review
    policy: required
    topology:
      codex: chatgpt
      chatgpt: codex
      other: user-selected-independent-ai-reviewer
    unavailable: pending
  ai_efficiency_review:
    rule_id: ai-efficiency-review
    policy: required
  cost_aware_review:
    rule_id: cost-aware-review
    policy: required
  final_merge: user

existing_rules:
  evaluation: pending
  default_cost_assessment: UNKNOWN
  policy:
    - evaluate each existing local engineering and AI-assisted workflow rule individually
    - do not assume an existing local rule is cheaper because it already exists

boundaries:
  runtime_dependency_on_ai_engineering: false
  project_specific_rules_remain_in_vivat_flow: true
  private_project_evidence_remains_in_vivat_flow: true
  reviewer_and_vendor_choices_remain_in_vivat_flow: true
